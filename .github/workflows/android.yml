name: Android client

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/build-android.yml']
  push:
    branches: [master]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/build-android.yml']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: dist
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VARIANT: ${{ needs.build.outputs.variant }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Its signed assets are immutable."
            exit 0
          fi
          if [[ "$VARIANT" == preview ]]; then
            flags=(--prerelease --target "$GITHUB_SHA")
            notes='Install the preview APK on Android 11 or newer. This separate preview package is signed with a build-specific test key. To install a later preview signed by another key, uninstall the previous preview and configure sync again.'
          else
            flags=(--verify-tag)
            notes='Signed Android release for Android 11 or newer.'
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}" --latest=false --title "DragonFox Drive $TAG" --notes "$notes"
